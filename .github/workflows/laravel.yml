
name: BioAttend Backend Tests

on:
  push:
    branches:
      - main
      - integration/backend-hardened
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pride_attendance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pgsql, pdo_pgsql, intl, zip, fileinfo
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Execute Laravel Tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pride_attendance
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
